name: iOS TestFlight Deployment

on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      app:
        description: 'App to Deploy'
        required: true
        default: 'plcore'
        type: choice
        options: [plcore]
      build_version:
        description: 'Build Version (e.g., 1.0.0)'
        required: false
        type: string
      build_number:
        description: 'Build Number (e.g., 1)'
        required: false
        type: string
      environment:
        description: 'Destination'
        required: true
        default: 'testflight'
        type: choice
        options: [testflight, appstore]
      release_notes:
        description: 'Release Notes'
        required: false
        type: string
        default: 'New build deployed via GitHub Actions'

# Cancel superseded runs on the same ref — a new push to deploy invalidates
# whatever's mid-flight.
concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'
  RUBY_VERSION: '3.3'

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # ── Fail fast on missing secrets ─────────────────────────────────────
      - name: Verify required secrets
        env:
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          missing=()
          for v in MATCH_SSH_PRIVATE_KEY MATCH_PASSWORD \
                   APP_STORE_CONNECT_API_KEY_KEY_ID \
                   APP_STORE_CONNECT_API_KEY_ISSUER_ID \
                   APP_STORE_CONNECT_API_KEY_KEY APPLE_ID; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read App Configuration
        id: config
        env:
          INPUT_APP: ${{ github.event.inputs.app }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          APP="${INPUT_APP:-plcore}"
          ENVIRONMENT="${INPUT_ENV:-testflight}"
          RELEASE_NOTES="${INPUT_NOTES:-Auto-deploy from push to deploy branch}"

          for k in bundle_id team_id app_store_connect_team_id itc_team_id name display_name; do
            v=$(jq -r ".apps[] | select(.id == \"$APP\") | .$k" .github/app_config.json)
            out_key=$k
            [ "$k" = "app_store_connect_team_id" ] && out_key="asc_team_id"
            [ "$k" = "name" ] && out_key="app_name"
            echo "$out_key=$v" >> $GITHUB_OUTPUT
          done
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          {
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "app=$APP" >> $GITHUB_OUTPUT

      # ── Setup toolchains (Ruby + Flutter both cache themselves) ──────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          working-directory: ios
          bundler-cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # ── Restore caches ────────────────────────────────────────────────────
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: derived-data-${{ runner.os }}-

      - name: Setup SSH Key for Match
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      # ── Optional pubspec version bump ────────────────────────────────────
      - name: Update Build Version
        if: github.event.inputs.build_version != ''
        run: |
          VERSION="${{ github.event.inputs.build_version }}"
          sed -i '' "s/^version: .*/version: $VERSION+${{ github.event.inputs.build_number || '1' }}/" pubspec.yaml

      # ── Update Info.plist display name (pbxproj bundle/team already committed) ─
      - name: Apply App Display Name
        run: |
          DISPLAY_NAME="${{ steps.config.outputs.display_name }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $DISPLAY_NAME" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $DISPLAY_NAME" ios/Runner/Info.plist

      # .env is gitignored but declared as a pubspec asset — the iOS build
      # fails ("No file or variants found for asset: .env") without it. CI
      # doesn't need real values here; runtime uses build-time secrets on web
      # and native reads from bundled config.
      - name: Ensure .env exists
        run: touch .env

      # pub get MUST complete before pod install — Podfile needs the
      # ios/Flutter/Generated.xcconfig that flutter pub get generates.
      - name: flutter pub get
        run: flutter pub get

      - name: pod install
        run: cd ios && bundle exec pod install --repo-update

      # ── Install match certs into CI keychain so flutter build ipa can sign ─
      - name: Install signing certs via match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_IDENTIFIER: ${{ steps.config.outputs.bundle_id }}
          TEAM_ID: ${{ steps.config.outputs.team_id }}
        run: |
          cd ios
          cat > /tmp/match_lane.rb <<'EOF'
          lane :install_certs do |options|
            key = app_store_connect_api_key(
              key_id: ENV["APP_STORE_CONNECT_API_KEY_KEY_ID"],
              issuer_id: ENV["APP_STORE_CONNECT_API_KEY_ISSUER_ID"],
              key_content: ENV["APP_STORE_CONNECT_API_KEY_KEY"],
              is_key_content_base64: true,
            )
            match(
              type: "appstore",
              app_identifier: ENV["APP_IDENTIFIER"],
              team_id: ENV["TEAM_ID"],
              api_key: key,
              readonly: true,
            )
          end
          EOF
          mkdir -p fastlane
          cp /tmp/match_lane.rb fastlane/Fastfile
          bundle exec fastlane install_certs

      # ── Build signed IPA with Flutter (fast, no xcodebuild Run Script hang) ─
      - name: Build IPA
        timeout-minutes: 30
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store</string>
              <key>teamID</key><string>${{ steps.config.outputs.team_id }}</string>
              <key>signingStyle</key><string>manual</string>
              <key>signingCertificate</key><string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ steps.config.outputs.bundle_id }}</key>
                  <string>match AppStore ${{ steps.config.outputs.bundle_id }}</string>
              </dict>
              <key>uploadBitcode</key><false/>
              <key>uploadSymbols</key><true/>
              <key>stripSwiftSymbols</key><true/>
              <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # ── Upload the IPA that flutter build ipa produced ───────────────────
      # We skip fastlane's build_app entirely because xcodebuild archive
      # inside fastlane keeps hanging on Flutter's Run Script phase. The
      # ipa is already at build/ios/ipa/*.ipa.
      - name: Deploy to TestFlight
        if: steps.config.outputs.environment == 'testflight'
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Uploading $IPA"
          cd ios
          cat > fastlane/Fastfile <<'EOF'
          lane :upload_ipa do |options|
            key = app_store_connect_api_key(
              key_id: ENV["APP_STORE_CONNECT_API_KEY_KEY_ID"],
              issuer_id: ENV["APP_STORE_CONNECT_API_KEY_ISSUER_ID"],
              key_content: ENV["APP_STORE_CONNECT_API_KEY_KEY"],
              is_key_content_base64: true,
            )
            upload_to_testflight(
              api_key: key,
              ipa: options[:ipa],
              app_identifier: options[:app_identifier],
              skip_waiting_for_build_processing: true,
              notify_external_testers: false,
              changelog: options[:release_notes],
            )
          end
          EOF
          bundle exec fastlane upload_ipa \
            ipa:"../$IPA" \
            app_identifier:"${{ steps.config.outputs.bundle_id }}" \
            release_notes:"${{ steps.config.outputs.release_notes }}"

      - name: Deploy to App Store
        if: steps.config.outputs.environment == 'appstore'
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Uploading $IPA to App Store"
          cd ios
          cat > fastlane/Fastfile <<'EOF'
          lane :upload_appstore do |options|
            key = app_store_connect_api_key(
              key_id: ENV["APP_STORE_CONNECT_API_KEY_KEY_ID"],
              issuer_id: ENV["APP_STORE_CONNECT_API_KEY_ISSUER_ID"],
              key_content: ENV["APP_STORE_CONNECT_API_KEY_KEY"],
              is_key_content_base64: true,
            )
            upload_to_app_store(
              api_key: key,
              ipa: options[:ipa],
              app_identifier: options[:app_identifier],
              skip_metadata: false,
              skip_screenshots: true,
              submit_for_review: false,
              automatic_release: false,
              release_notes: { 'default' => options[:release_notes] },
            )
          end
          EOF
          bundle exec fastlane upload_appstore \
            ipa:"../$IPA" \
            app_identifier:"${{ steps.config.outputs.bundle_id }}" \
            release_notes:"${{ steps.config.outputs.release_notes }}"

      # ── Always upload IPA + logs as artifacts ────────────────────────────
      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ steps.config.outputs.app }}-${{ github.run_number }}
          path: ios/build/**/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            ios/build_logs
            ios/fastlane/report.xml
            ~/Library/Logs/gym
          retention-days: 7
