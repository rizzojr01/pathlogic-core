<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="PathLogic - Indoor Navigation Assistant"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="PathLogic" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>PathLogic</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <!--
      One-time cleanup for browsers that installed the old service worker
      (before we switched to --pwa-strategy=none). Without this the old SW
      keeps serving cached assets even after a new deploy — users would need
      to manually clear site data. Runs on every load; no-op once done.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var r of regs) r.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          for (var k of keys) caches.delete(k);
        });
      }
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
